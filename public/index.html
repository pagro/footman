<script>
const c = document.getElementById('game'), ctx = c.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
  c.width=W*DPR; c.height=H*DPR; c.style.width=W+'px'; c.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize); resize();

const world={w:1800,h:1100};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);
const len=(x,y)=>Math.hypot(x,y)||1;
function approachAngle(current,target,maxStep){
  let diff=((target-current+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;
  if(Math.abs(diff)<=maxStep) return target;
  return current+Math.sign(diff)*maxStep;
}

// ---------- AUDIO ----------
let audioCtx=null;
function ensureAudio(){
  if(!audioCtx){
    const AC=window.AudioContext||window.webkitAudioContext;
    if(AC) audioCtx=new AC();
  }
  if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
}
function tone(freq=440,dur=.06,type='square',gain=.035,slide=0){
  ensureAudio(); if(!audioCtx) return;
  const now=audioCtx.currentTime;
  const osc=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  osc.type=type;
  osc.frequency.setValueAtTime(freq,now);
  if(slide) osc.frequency.exponentialRampToValueAtTime(Math.max(35,freq+slide),now+dur);
  g.gain.setValueAtTime(gain*1.2,now);
  g.gain.exponentialRampToValueAtTime(.0001,now+dur);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(now); osc.stop(now+dur);
}
function noiseBurst(dur=.05,gain=.02,highpass=900){
  ensureAudio(); if(!audioCtx) return;
  const sr=audioCtx.sampleRate;
  const buffer=audioCtx.createBuffer(1,Math.floor(sr*dur),sr);
  const data=buffer.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i]=Math.random()*2-1;
  const src=audioCtx.createBufferSource();
  const filter=audioCtx.createBiquadFilter();
  const g=audioCtx.createGain();
  filter.type='highpass'; filter.frequency.value=highpass;
  g.gain.setValueAtTime(gain*1.2,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);
  src.buffer=buffer; src.connect(filter); filter.connect(g); g.connect(audioCtx.destination); src.start();
}
function soundShot(t='rifle'){
  // Physical weapons: punchy/noisy family, but each has a distinct signature.
  if(t==='rifle'){
    noiseBurst(.042,.022,1250); tone(185,.048,'square',.020,-58);
  }else if(t==='shotgun'){
    noiseBurst(.085,.040,500); tone(105,.085,'sawtooth',.032,-48);
  }else if(t==='machinegun'){
    noiseBurst(.030,.018,1450); tone(215,.034,'square',.016,-72);
  }else if(t==='carbine'){
    noiseBurst(.035,.016,1600); tone(255,.038,'square',.014,-70);
  }else if(t==='physicalPistol'){
    noiseBurst(.032,.018,1350); tone(245,.050,'square',.018,-85);
  // Energy weapons: tonal/electronic family, distinct by weapon.
  }else if(t==='blaster'){
    tone(690,.085,'sawtooth',.030,-210); tone(1040,.045,'sine',.014,-260);
  }else if(t==='plasma'){
    tone(420,.070,'sine',.025,180); tone(760,.052,'triangle',.014,-120);
  }else if(t==='plasmaSMG'){
    tone(520,.040,'square',.017,150); tone(880,.032,'triangle',.010,-180);
  }else if(t==='zapper'){
    tone(980,.060,'square',.022,-420); tone(1380,.035,'triangle',.012,-520);
  }else if(t==='cannon'){
    tone(160,.18,'sawtooth',.040,-65); noiseBurst(.08,.030,240); tone(520,.12,'sine',.016,-250);
  }else if(t==='knife'){
    tone(520,.05,'triangle',.020,-150);
  }else if(t==='energy'){
    tone(720,.08,'sawtooth',.030,-230); tone(1120,.05,'sine',.016,-300);
  }else{
    noiseBurst(.04,.020,1200); tone(180,.045,'square',.020,-55);
  }
}
function soundEnergyAbsorb(){ tone(860,.07,'sine',.03,-300); tone(1280,.045,'triangle',.016,-420); }
function soundHpHit(){ noiseBurst(.055,.027,520); tone(120,.055,'square',.02,-35); }

function circleHitsRect(x,y,r,rect){
  const nx=clamp(x,rect.x,rect.x+rect.w), ny=clamp(y,rect.y,rect.y+rect.h);
  const dx=x-nx, dy=y-ny;
  return dx*dx+dy*dy < r*r;
}
function hitsWall(x,y,r=0){ for(const w of walls) if(circleHitsRect(x,y,r,w)) return w; return null; }
function moveWithWalls(ent,dx,dy){
  let collided=false, ox=ent.x, oy=ent.y;
  ent.x += dx;
  if(hitsWall(ent.x,ent.y,ent.r) || circleHitsGenerator(ent.x,ent.y,ent.r)){
    ent.x=ox; if('vx' in ent) ent.vx*=0.12; collided=true;
  }
  ent.y += dy;
  if(hitsWall(ent.x,ent.y,ent.r) || circleHitsGenerator(ent.x,ent.y,ent.r)){
    ent.y=oy; if('vy' in ent) ent.vy*=0.12; collided=true;
  }
  return collided;
}

function resolveOpposingPlayerCollision(a,b){
  if(!a || !b || a.team===b.team) return;
  const dx=b.x-a.x, dy=b.y-a.y;
  const minDist=a.r+b.r;
  const d=Math.hypot(dx,dy);
  if(d<=0 || d>=minDist) return;

  const nx=dx/d, ny=dy/d;
  const overlap=minDist-d;
  const pushA=overlap*.5, pushB=overlap*.5;

  const ax=a.x-nx*pushA, ay=a.y-ny*pushA;
  const bx=b.x+nx*pushB, by=b.y+ny*pushB;

  if(!hitsWall(ax,ay,a.r)){ a.x=ax; a.y=ay; }
  if(!hitsWall(bx,by,b.r)){ b.x=bx; b.y=by; }

  // Remove inward velocity so opponents cannot phase through one another.
  const arv=a.vx*nx+a.vy*ny;
  if(arv>0){ a.vx-=nx*arv*.8; a.vy-=ny*arv*.8; }
  const brv=b.vx*nx+b.vy*ny;
  if(brv<0){ b.vx-=nx*brv*.8; b.vy-=ny*brv*.8; }
}

function segmentHitsRect(x1,y1,x2,y2,r){
  let t0=0,t1=1;
  const dx=x2-x1, dy=y2-y1;
  const tests=[
    [-dx, x1-r.x],
    [ dx, r.x+r.w-x1],
    [-dy, y1-r.y],
    [ dy, r.y+r.h-y1]
  ];
  for(const [p,q] of tests){
    if(Math.abs(p)<1e-9){
      if(q<0) return false;
    }else{
      const t=q/p;
      if(p<0){ if(t>t1) return false; if(t>t0) t0=t; }
      else { if(t<t0) return false; if(t<t1) t1=t; }
    }
  }
  return true;
}
function lineBlocked(x1,y1,x2,y2){
  for(const w of walls) if(segmentHitsRect(x1,y1,x2,y2,w)) return true;
  return false;
}

const VISION_RANGE=520;
const SENSOR_RADIUS=180;
const JAMMER_RADIUS=306;
const FORTIFY_SHIELD_HP=200;

function getTeamVisionSources(team){
  const sources=[];

  if(player.team===team && player.deadTimer<=0){
    sources.push(player);
  }

  for(const ally of allies){
    if(ally.team===team && ally.hp>0) sources.push(ally);
  }

  for(const e of enemies){
    if(e.team===team && e.hp>0) sources.push(e);
  }

  return sources;
}

function isEntityVisibleToTeam(target,team){
  if(!target) return false;
  if(target.team===team) return true;

  // Debug radar: a blue-team pulse reveals every red player map-wide.
  if(team===player.team && target.team!==player.team && radarRevealTimer>0) return true;

  const sources=getTeamVisionSources(team);
  for(const source of sources){
    const d=Math.hypot(target.x-source.x,target.y-source.y);
    if(d>VISION_RANGE) continue;
    if(!lineBlocked(source.x,source.y,target.x,target.y)) return true;
  }
  return false;
}

function getLivingTeamMembers(team){
  const out=[];
  if(player.team===team && player.deadTimer<=0 && player.hp>0) out.push(player);
  for(const ally of allies){
    if(ally.team===team && ally.hp>0) out.push(ally);
  }
  for(const e of enemies){
    if(e.team===team && e.hp>0) out.push(e);
  }
  return out;
}

function chooseVisibleEnemyTarget(observer,enemyTeam){
  let best=null;
  let bestDist=Infinity;
  for(const target of getLivingTeamMembers(enemyTeam)){
    if(!isEntityVisibleToTeam(target,observer.team)) continue;
    const d=Math.hypot(target.x-observer.x,target.y-observer.y);
    if(d<bestDist){
      bestDist=d;
      best=target;
    }
  }
  return best;
}

function isHumanPlayer(ent){
  return ent===player;
}


function isClearSpawn(x,y,r){
  if(x<r+6 || x>world.w-r-6 || y<r+6 || y>world.h-r-6) return false;
  return !hitsWall(x,y,r+2);
}

function findClearSpawn(preferredX,preferredY,r,region=null){
  // First try the preferred point, then expand outward in rings.
  if(isClearSpawn(preferredX,preferredY,r)) return {x:preferredX,y:preferredY};

  for(let radius=20;radius<=240;radius+=20){
    for(let i=0;i<16;i++){
      const a=(Math.PI*2*i)/16;
      const x=preferredX+Math.cos(a)*radius;
      const y=preferredY+Math.sin(a)*radius;
      if(region && (x<region.x1 || x>region.x2 || y<region.y1 || y>region.y2)) continue;
      if(isClearSpawn(x,y,r)) return {x,y};
    }
  }

  // Random fallback within a supplied region.
  const area=region || {x1:40,x2:world.w-40,y1:40,y2:world.h-40};
  for(let i=0;i<250;i++){
    const x=rand(area.x1,area.x2), y=rand(area.y1,area.y2);
    if(isClearSpawn(x,y,r)) return {x,y};
  }

  // Last-resort known-clear-ish center point, still checked.
  const fallbacks=[
    {x:285,y:world.h/2},
    {x:world.w-285,y:world.h/2},
    {x:world.w/2,y:world.h/2}
  ];
  for(const p of fallbacks) if(isClearSpawn(p.x,p.y,r)) return p;
  return {x:40+r,y:40+r};
}
function chooseHeavySpot(e,target){
  if(!target) return;
  const candidates=[];
  for(const w of walls){
    if(w.kind==='base') continue;
    const m=30;
    candidates.push(
      {x:w.x-m,y:w.y+w.h/2},
      {x:w.x+w.w+m,y:w.y+w.h/2},
      {x:w.x+w.w/2,y:w.y-m},
      {x:w.x+w.w/2,y:w.y+w.h+m}
    );
  }
  let best=null,bestScore=1e9;
  for(const p of candidates){
    if(p.x<40||p.x>world.w-40||p.y<40||p.y>world.h-40||hitsWall(p.x,p.y,e.r)) continue;
    const dp=Math.hypot(target.x-p.x,target.y-p.y);
    if(dp<250||dp>500||lineBlocked(p.x,p.y,target.x,target.y)) continue;
    const travel=Math.hypot(e.x-p.x,e.y-p.y);
    const score=Math.abs(dp-365)+travel*.25;
    if(score<bestScore){bestScore=score;best=p;}
  }
  if(!best){
    const a=Math.atan2(e.y-target.y,e.x-target.x);
    best={
      x:clamp(target.x+Math.cos(a)*360,40,world.w-40),
      y:clamp(target.y+Math.sin(a)*360,40,world.h-40)
    };
  }
  e.heavySpotX=best.x;
  e.heavySpotY=best.y;
  e.heavySpotTimer=rand(4.5,7.0);
}

function pointInRect(x,y,r){
  return x>=r.x && x<=r.x+r.w && y>=r.y && y<=r.y+r.h;
}

function circleHitsGenerator(x,y,r=0,gen=null){
  const list=gen?[gen]:generators;
  for(const g of list){
    const nx=clamp(x,g.x,g.x+g.w), ny=clamp(y,g.y,g.y+g.h);
    const dx=x-nx, dy=y-ny;
    if(dx*dx+dy*dy < r*r) return g;
  }
  return null;
}

function pointRectDistance(x,y,r){
  const nx=clamp(x,r.x,r.x+r.w), ny=clamp(y,r.y,r.y+r.h);
  return Math.hypot(x-nx,y-ny);
}

function isGeneratorBackDoorHit(gen,x,y,weaponKind){
  if(weaponKind!=='cannon' && weaponKind!=='grenade' && weaponKind!=='zapper') return false;

  // Weak-point bonuses can only be earned from INSIDE the base building.
  const inside=pointInRect(x,y,gen.interior);
  if(!inside) return false;

  const cy=gen.y+gen.h/2;
  if(Math.abs(y-cy)>70) return false;

  // Weak panel faces INWARD toward each base's entrance/battlefield side:
  // east for blue, west for red.
  if(gen.backDoor.side==='west') return x<=gen.x+gen.w*.45;
  return x>=gen.x+gen.w*.55;
}

function grenadeEntersGeneratorWeakSpot(g,gen,nextX,nextY){
  if(!g || !gen || gen.destroyed || g.embeddedGenerator) return false;

  // Must be moving inward through the exposed panel, not merely touching
  // the generator body from another side.
  const inward = gen.backDoor.side==='west' ? g.vx>0 : g.vx<0;
  if(!inward) return false;

  const panel=gen.backDoor;
  const nx=clamp(nextX,panel.x,panel.x+panel.w);
  const ny=clamp(nextY,panel.y,panel.y+panel.h);
  const dx=nextX-nx, dy=nextY-ny;
  return dx*dx+dy*dy <= g.r*g.r;
}

function embedGrenadeInGenerator(g,gen,y){
  g.embeddedGenerator=gen;

  // Seat the grenade just inside the weak-point face. It remains there until
  // its normal fuse expires and cannot bounce back out.
  g.x=gen.backDoor.side==='west'
    ? gen.x+g.r+4
    : gen.x+gen.w-g.r-4;
  g.y=clamp(y,gen.y+g.r+3,gen.y+gen.h-g.r-3);
  g.vx=0;
  g.vy=0;
  g.playerBounceCd=999;
}

function damageGenerator(gen,rawDamage,weaponKind,hitX,hitY){
  if(!gen || gen.destroyed || rawDamage<=0) return 0;

  let mult=weaponKind==='knife' ? .10 : .25;
  if(isGeneratorBackDoorHit(gen,hitX,hitY,weaponKind)) mult*=3;

  const dealt=Math.max(0,rawDamage*mult);
  gen.hp=Math.max(0,gen.hp-dealt);

  if(gen.hp<=0 && !gen.destroyed){
    gen.destroyed=true;
    gameOver=true;
    matchFrozen=false;
    postVictoryTimer=20;
    winningTeam=gen.team==='blue' ? 'red' : 'blue';
    blasts.push({
      x:gen.x+gen.w/2,
      y:gen.y+gen.h/2,
      r:120,
      life:.65,
      maxLife:.65,
      kind:'cannon'
    });
    soundCannonExplosion();
  }
  return dealt;
}

function mpSetStatus(text,error=false){

function mpBadge(){
  const el=document.getElementById('mpBadge');
  if(!el)return;
  el.textContent=netJoined
    ? `ROOM ${netRoomCode} • 4v4 • ${player.team.toUpperCase()}`
    : (netConnected?'CONNECTED':'OFFLINE');

function mpSend(obj){
  if(netSocket&&netSocket.readyState===WebSocket.OPEN)netSocket.send(JSON.stringify(obj));
}
function mpWsUrl(){
  return `${location.protocol==='https:'?'wss':'ws'}://${location.host}`;
}
function mpConnect(){
  try{netSocket=new WebSocket(mpWsUrl());}
  catch(_){mpSetStatus('Could not open multiplayer connection.',true);return;}

  netSocket.addEventListener('open',()=>{
    netConnected=true;
    mpSetStatus('Connected. Create or join a room.');
    mpBadge();
  });
  netSocket.addEventListener('close',()=>{
    netConnected=false;netJoined=false;
    mpSetStatus('Disconnected from server.',true);
    mpBadge();
  });
  netSocket.addEventListener('error',()=>mpSetStatus('Multiplayer connection error.',true));

  netSocket.addEventListener('message',ev=>{
    let msg;try{msg=JSON.parse(ev.data);}catch(_){return;}

    if(msg.type==='room_created'||msg.type==='room_joined'){
      netRoomCode=msg.roomCode;
      netPlayerId=msg.playerId;
      netJoined=true;
      const input=document.getElementById('mpRoomInput');
      if(input)input.value=netRoomCode;
      document.getElementById('mpLobby')?.classList.add('hidden');
      mpBadge();
      setMultiplayerName(netPlayerName);
      renderRespawnClassPicker();
      return;
    }

    if(msg.type==='error'){
      mpSetStatus(msg.message||'Server error.',true);
      return;
    }

    if(msg.type==='snapshot')applyNetworkSnapshot(msg);
    else if(msg.type==='game_event')handleGameEvent(msg.event);
  });
}

function applyNetworkSnapshot(msg){
  const me=msg.players.find(p=>p.id===netPlayerId);

  if(me){
    const initialized=!!player._netInitialized;
    const currentX=player.x,currentY=player.y,currentA=player.angle;
    const currentVx=player.vx||0,currentVy=player.vy||0;
    Object.assign(player,me);
    player._netInitialized=true;
    player._tx=me.x;player._ty=me.y;player._ta=me.angle;
    if(initialized){
      const error=Math.hypot(currentX-me.x,currentY-me.y);
      if(error<90){
        player.x=currentX;player.y=currentY;player.angle=currentA;
        player.vx=currentVx;player.vy=currentVy;
      }
    }
    player.team=msg.team||me.team;
    player.pendingClassId=me.pendingClassId||me.classId;
    player.energyPulse=player.energyPulse||0;
    player.weaponMarks=player.weaponMarks||makeDefaultWeaponMarks();
    if(me.ready&&!roundStarted)roundStarted=true;
  }

  const sameTeam=[];
  const seenIds=new Set();

  for(const p of msg.players){
    if(p.id===netPlayerId)continue;

    if(p.team===player.team){
      sameTeam.push({
        ...p,_tx:p.x,_ty:p.y,_ta:p.angle,
        energyPulse:0,weaponMarks:makeDefaultWeaponMarks()
      });
      continue;
    }

    seenIds.add(p.id);
    let cached=netEnemyCache.get(p.id);
    if(!cached){
      cached={
        ...p,x:p.x,y:p.y,angle:p.angle,
        visAlpha:0,energyPulse:0,weaponMarks:makeDefaultWeaponMarks()
      };
      netEnemyCache.set(p.id,cached);
    }
    const cx=cached.x,cy=cached.y,ca=cached.angle;
    Object.assign(cached,p);
    cached._tx=p.x;cached._ty=p.y;cached._ta=p.angle;
    cached.x=cx;cached.y=cy;cached.angle=ca;
    cached.visAlpha=Math.min(1,(cached.visAlpha||0)+.20);
  }

  for(const [id,e] of netEnemyCache){
    if(!seenIds.has(id)){
      e.visAlpha=Math.max(0,(e.visAlpha||0)-.14);
      if(e.visAlpha<=.01)netEnemyCache.delete(id);
    }
  }

function getActiveSlotData(){

function getWeaponCooldownRemaining(kind){
  if(kind==='rifle' || kind==='medicGun') return Math.max(0,player.fireCd||0);
  if(kind==='plasmaPistol'){
    return (player.classId==='medic'||player.classId==='sergeant')
      ? Math.max(0,player.medicPistolCd||0)
      : Math.max(0,player.fireCd||0);
  }
  if(kind==='plasmaSMG') return Math.max(0,player.fireCd||0);
  if(kind==='machinegun') return Math.max(0,player.machineCd||0,player.machineBurstTimer||0);
  if(kind==='flamethrower') return Math.max(0,player.flameCd||0);
  if(kind==='blaster') return Math.max(0,player.blasterCd||0);
  if(kind==='shotgun') return Math.max(0,player.shotgunCd||0);
  if(kind==='cannon') return Math.max(0,player.cannonCd||0);
  if(kind==='physicalPistol') return Math.max(0,player.utilityCd||0);
  if(kind==='knife') return Math.max(0,player.utilityCd||0);
  if(kind==='heal') return Math.max(0,player.healCd||0);
  if(kind==='jammer') return Math.max(0,player.jammerReactivationCd||0);
  if(kind==='sensors') return Math.max(0,player.sensorsReactivationCd||0);
  if(kind==='grenade' || kind==='zapper') return Math.max(0,player.grenadeCd||0);
  return 0;
}

function updateLoadoutCooldownVisuals(){

  const buttons=box.querySelectorAll('.slot');
  const data=getActiveSlotData();
  buttons.forEach((button,i)=>{
    const weapon=data[i];
    const remaining=weapon ? getWeaponCooldownRemaining(weapon.kind) : 0;
    const cooling=remaining>0.01;
    button.classList.toggle('cooldown',cooling);

    let cd=button.querySelector('.cdtime');
    if(cooling){
      if(!cd){
        cd=document.createElement('span');
        cd.className='cdtime';
        const row=button.querySelector('.row');
        if(row) row.appendChild(cd);
      }
      cd.textContent=remaining>=10 ? `${Math.ceil(remaining)}s` : `${remaining.toFixed(1)}s`;
    }else if(cd){
      cd.remove();
    }
  });
}

function updateTestAllies(dt){
  for(const ally of [...allies]){
    if(ally.hp<=0) continue;

    ally.lastHit+=dt;
    ally.energyPulse=Math.max(0,(ally.energyPulse||0)-dt*3.2);
    ally.slowTimer=Math.max(0,(ally.slowTimer||0)-dt);
    ally.zapTimer=Math.max(0,(ally.zapTimer||0)-dt);
    ally.regenSlowTimer=Math.max(0,(ally.regenSlowTimer||0)-dt);
    ally.fireCd=Math.max(0,(ally.fireCd||0)-dt);
    ally.rifleBurstTimer=Math.max(0,(ally.rifleBurstTimer||0)-dt);
    ally.blasterCd=Math.max(0,(ally.blasterCd||0)-dt);

    const rechargeWait=4+(ally.zapRechargeExtra||0);
    if(ally.lastHit>=rechargeWait && ally.zapRechargeExtra>0) ally.zapRechargeExtra=0;
    if(ally.lastHit>=rechargeWait && ally.energy<ally.maxEnergy){
      const regenMult=ally.regenSlowTimer>0?.35:1;
      ally.energy=Math.min(ally.maxEnergy,ally.energy+ally.energyRegen*regenMult*dt);
    }

    const statusMult=ally.slowTimer>0?.25:1;
    const moveSpeed=ally.maxSpeed*statusMult;

    // Pick nearest visible enemy.
    let target=null,best=Infinity;
    for(const e of enemies){
      if(e.hp<=0 || !isEntityVisibleToTeam(e,ally.team)) continue;
      const d=Math.hypot(e.x-ally.x,e.y-ally.y);
      if(d<best){ best=d; target=e; }
    }

    // Determine invasion direction by team.
    const dir = ally.team==='blue' ? 1 : -1;
    const ownBaseEdge = ally.team==='blue' ? 440 : 1360;
    const centerX = world.w/2;

    // How far the human player has pushed from their own base toward enemy territory.
    const playerAdvance = ally.team==='blue'
      ? clamp((player.x-ownBaseEdge)/(centerX-ownBaseEdge),0,2)
      : clamp((ownBaseEdge-player.x)/(ownBaseEdge-centerX),0,2);

    // Default strategic anchor:
    // - when player is near home, gently drift toward center
    // - once player advances, trail behind them and slightly offset to support
    let supportX, supportY;

    if(playerAdvance<.35){
      supportX = centerX - dir*150;
      supportY = world.h/2 + Math.sin(performance.now()*.0008)*90;
    }else{
      // Follow the invasion, but stay about 110 units behind the player.
      supportX = player.x - dir*110;

      // Offset vertically so ally doesn't stack directly on the player.
      const side = Math.sin(performance.now()*.0012 + (ally.patrolIndex||0))>=0 ? 1 : -1;
      supportY = player.y + side*75;

      // Don't overrun the player too far into the enemy rear.
      supportX = ally.team==='blue'
        ? clamp(supportX,centerX-180,world.w-300)
        : clamp(supportX,300,centerX+180);
      supportY = clamp(supportY,120,world.h-120);
    }

    if(target){
      const dx=target.x-ally.x, dy=target.y-ally.y;
      const d=Math.hypot(dx,dy);
      ally.angle=approachAngle(ally.angle,Math.atan2(dy,dx),2.1*statusMult*dt);

      const clearShot=!lineBlocked(ally.x,ally.y,target.x,target.y);

      if(clearShot && d<500){
        const rifle=weaponStats.rifle;

        if(ally.fireCd<=0 && ally.rifleBurstLeft===0){
          ally.rifleBurstLeft=rifle.burstCount;
          ally.rifleBurstTimer=0;
        }

        if(ally.rifleBurstLeft>0 && ally.rifleBurstTimer<=0){
          shoot(
            'a',
            ally.x+Math.cos(ally.angle)*18,
            ally.y+Math.sin(ally.angle)*18,
            ally.angle+rand(-.04,.04),
            rifle.speed,
            rifle.damage,
            {type:'physical',color:'#ffe37b'}
          );
          soundShot('rifle');
          ally.rifleBurstLeft--;
          if(ally.rifleBurstLeft>0) ally.rifleBurstTimer=rifle.burstGap;
          else ally.fireCd=rifle.cooldown;
        }

        const blaster=weaponStats.blaster;
        const cost=ally.maxEnergy*blaster.energyCostPct;
        if(d<330 && ally.blasterCd<=0 && ally.energy>=cost && Math.random()<dt*.22){
          ally.energy-=cost;
          shoot(
            'a',
            ally.x+Math.cos(ally.angle)*18,
            ally.y+Math.sin(ally.angle)*18,
            ally.angle,
            blaster.speed,
            blaster.damage,
            {
              type:'energy',color:'#74d8ff',longBeam:true,
              energyMult:blaster.energyMult,hpMult:blaster.hpMult,
              regenSlowDuration:blaster.regenSlowDuration,
              regenSlowMult:blaster.regenSlowMult,
              bouncesLeft:blaster.bounces,life:blaster.life
            }
          );
          soundShot('blaster');
          ally.blasterCd=blaster.cooldown;
        }
      }else{
        ally.rifleBurstLeft=0;
      }

      // Combat movement:
      // bias toward the support anchor, while maintaining a safe engagement range.
      let mx=(supportX-ally.x)*.7;
      let my=(supportY-ally.y)*.7;

      if(d>300){
        mx+=dx*.55; my+=dy*.55;
      }else if(d<170){
        mx-=dx*.85; my-=dy*.85;
      }else{
        // Gentle lateral strafe at ideal range.
        mx+=-dy*.18; my+=dx*.18;
      }

      const ml=Math.hypot(mx,my);
      if(ml>10){
        ally.vx=(mx/ml)*moveSpeed;
        ally.vy=(my/ml)*moveSpeed;
        moveWithWalls(ally,ally.vx*dt,ally.vy*dt);
      }else{
        ally.vx*=Math.max(0,1-5*dt);
        ally.vy*=Math.max(0,1-5*dt);
      }
    }else{
      ally.rifleBurstLeft=0;

      // No visible enemy: gently move toward strategic support position.
      const dx=supportX-ally.x, dy=supportY-ally.y;
      const d=Math.hypot(dx,dy);

      if(d>28){
        ally.angle=approachAngle(ally.angle,Math.atan2(dy,dx),1.7*statusMult*dt);
        const gentleSpeed=moveSpeed*.62;
        ally.vx=(dx/d)*gentleSpeed;
        ally.vy=(dy/d)*gentleSpeed;
        moveWithWalls(ally,ally.vx*dt,ally.vy*dt);
      }else{
        ally.vx*=Math.max(0,1-4*dt);
        ally.vy*=Math.max(0,1-4*dt);
      }
    }

    ally.x=clamp(ally.x,28,world.w-28);
    ally.y=clamp(ally.y,28,world.h-28);
  }
}

function bulletDamageScale(b){
  if(!b.fade) return 1;
  const d=Math.hypot(b.x-b.startX,b.y-b.startY);
  if(d<=b.falloffStart) return 1;
  if(d>=b.falloffEnd) return b.minScale;
  const t=(d-b.falloffStart)/(b.falloffEnd-b.falloffStart);
  return 1-(1-b.minScale)*t;
}

function explodeCannonBall(b){
  const radius=b.explodeRadius||68;
  const damage=b.explodeDamage||120;

  blasts.push({x:b.x,y:b.y,r:radius,life:.34,maxLife:.34,kind:'cannon'});
  soundCannonExplosion();

  const gen=enemyGeneratorForOwner(b.owner);
  if(gen && !gen.destroyed){
    const gd=pointRectDistance(b.x,b.y,gen);
    if(gd<=radius && !lineBlocked(b.x,b.y,gen.x+gen.w/2,gen.y+gen.h/2)){
      const scale=1-clamp(gd/radius,0,1)*0.45;
      damageGenerator(gen,damage*scale,'cannon',b.x,b.y);
    }
  }

  if(b.owner==='p' || b.owner==='a'){
    for(const e of [...enemies]){
      const d=Math.hypot(e.x-b.x,e.y-b.y);
      if(d<=radius+e.r && !lineBlocked(b.x,b.y,e.x,e.y)){
        const scale=1-clamp(d/radius,0,1)*0.45;
        applyDamage(e,damage*scale,{
          energyMult:weaponStats.cannon.energyMult,
          hpMult:weaponStats.cannon.hpMult
        });
        if(e.hp<=0) killEnemy(e);
      }
    }
  }else{
    for(const target of getLivingTeamMembers(player.team)){
      const d=Math.hypot(target.x-b.x,target.y-b.y);
      if(d<=radius+target.r && !lineBlocked(b.x,b.y,target.x,target.y)){
        const scale=1-clamp(d/radius,0,1)*0.45;
        applyDamage(target,damage*scale,{
          energyMult:weaponStats.cannon.energyMult,
          hpMult:weaponStats.cannon.hpMult,
          toughnessMult:isHumanPlayer(target)?(1-toughness(player.bounty)):1
        });
        if(target.hp<=0) killBlueTarget(target);
      }
    }
  }
}

function drawSoldier(x,y,angle,bodyColor,detailColor,r,classId='footman'){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(angle);

  // soft shadow
  ctx.fillStyle='rgba(0,0,0,.20)';
  ctx.beginPath();
  ctx.ellipse(0,r*.68,r*1.05,r*.45,0,0,Math.PI*2);
  ctx.fill();

  if(classId==='heavy'){
    // Heavy: broader frame with visible armor plating and shoulder pads.
    ctx.fillStyle=bodyColor;
    ctx.beginPath();
    ctx.roundRect(-r*.95,-r*.72,r*1.55,r*1.42,r*.28);
    ctx.fill();

    ctx.fillRect(-r*.55,-r*.98,r*.90,r*.30);   // top chest/neck armor
    ctx.fillRect(-r*1.10,-r*.55,r*.34,r*.72);  // left shoulder pad
    ctx.fillRect(r*.42,-r*.55,r*.34,r*.72);    // right shoulder pad

    ctx.fillStyle=detailColor;
    ctx.beginPath();
    ctx.arc(r*.62,0,r*.28,0,Math.PI*2);
    ctx.fill();
    ctx.fillRect(-r*.18,-r*.40,r*.48,r*.16);   // visor / faceplate highlight
    ctx.fillRect(-r*.52,r*.00,r*.92,r*.16);    // armor stripe

    ctx.fillStyle='rgba(255,255,255,.18)';
    ctx.fillRect(-r*.45,-r*.52,r*.28,r*.18);
    ctx.fillRect(-r*.05,-r*.52,r*.28,r*.18);
  }else if(classId==='medic'){
    // Medic: standard body plus a distinctive helmet.
    ctx.fillStyle=bodyColor;
    ctx.beginPath();
    ctx.ellipse(-r*.06,0,r*.82,r*.60,0,0,Math.PI*2);
    ctx.fill();

    // helmet shell
    ctx.fillStyle=detailColor;
    ctx.beginPath();
    ctx.arc(r*.48,0,r*.34,0,Math.PI*2);
    ctx.fill();

    // helmet rim
    ctx.fillStyle=bodyColor;
    ctx.fillRect(r*.22,-r*.10,r*.48,r*.20);

    // small medic cap/stripe
    ctx.fillStyle='rgba(255,255,255,.82)';
    ctx.fillRect(r*.34,-r*.26,r*.18,r*.10);

    // backpack / support gear
    ctx.fillStyle='rgba(255,255,255,.12)';
    ctx.fillRect(-r*.72,-r*.32,r*.24,r*.64);
  }else if(classId==='sergeant'){
    // Sergeant: command silhouette with a visible gold rank badge.
    ctx.fillStyle=bodyColor;
    ctx.beginPath();
    ctx.ellipse(-r*.04,0,r*.84,r*.62,0,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle=detailColor;
    ctx.beginPath();
    ctx.arc(r*.54,0,r*.29,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle=detailColor;
    ctx.beginPath();
    ctx.moveTo(-r*.22,-r*.34);
    ctx.lineTo(r*.12,-r*.22);
    ctx.lineTo(-r*.06,-r*.04);
    ctx.lineTo(-r*.38,-r*.17);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle=detailColor;
    ctx.fillRect(-r*.24,-r*.27,r*.22,r*.08);

  }else if(classId==='assassin'){
    // Assassin: narrower, sleek body and pointed head profile.
    ctx.fillStyle=bodyColor;
    ctx.beginPath();
    ctx.ellipse(-r*.02,0,r*.70,r*.46,0,0,Math.PI*2);
    ctx.fill();

    // sleek head / visor
    ctx.fillStyle=detailColor;
    ctx.beginPath();
    ctx.ellipse(r*.52,0,r*.24,r*.20,0,0,Math.PI*2);
    ctx.fill();

    // pointed front silhouette
    ctx.fillStyle=bodyColor;
    ctx.beginPath();
    ctx.moveTo(r*.52,-r*.16);
    ctx.lineTo(r*.84,0);
    ctx.lineTo(r*.52,r*.16);
    ctx.closePath();
    ctx.fill();

    // back fin / cloak line
    ctx.fillStyle='rgba(255,255,255,.14)';
    ctx.beginPath();
    ctx.moveTo(-r*.74,0);
    ctx.lineTo(-r*.36,-r*.18);
    ctx.lineTo(-r*.32,r*.18);
    ctx.closePath();
    ctx.fill();
  }else{
    // Footman/default: clean standard soldier silhouette.
    ctx.fillStyle=bodyColor;
    ctx.beginPath();
    ctx.ellipse(0,0,r*.85,r*.65,0,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle=detailColor;
    ctx.beginPath();
    ctx.arc(r*.55,0,r*.28,0,Math.PI*2);
    ctx.fill();
  }

  // universal weapon/forward indicator
  ctx.fillStyle=detailColor;
  ctx.fillRect(r*.45,-2,r*.9,4);

  ctx.restore();
}

function drawCorpseModel(c){
  if(!c) return;

  const body='#62676d';
  const detail='#91979d';

  ctx.save();

  // Flatten the character so it clearly reads as a body on the floor.
  ctx.translate(c.x,c.y);
  ctx.rotate(c.angle);
  ctx.scale(1.12,.72);
  ctx.translate(-c.x,-c.y);

  // Universal dead-player treatment: use native gray colors directly.
  // Avoid Canvas filters here—they are expensive on mobile and caused
  // noticeable frame drops during the respawn state.
  ctx.globalAlpha=.42;
  drawSoldier(c.x,c.y,c.angle,body,detail,c.r,c.classId||'footman');

  ctx.globalAlpha=.18;
  ctx.fillStyle='black';
  ctx.beginPath();
  ctx.ellipse(c.x,c.y+7,c.r*1.4,c.r*.58,0,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}

  cash+=payout; kills++; player.streak++; player.bounty += 5 + Math.floor(player.streak/5);

function applyDamage(target,dmg,opts={}){
  const energyPct=clamp(target.energy/target.maxEnergy,0,1);
  const blockedBase=dmg*energyPct;
  const blockedDrain=blockedBase*(opts.energyMult ?? 1);
  const hpDamage=(dmg-blockedBase)*(opts.hpMult ?? 1);
  if(blockedDrain>0){
    target.energy=Math.max(0,target.energy-blockedDrain);
    target.energyPulse=1.0;
    soundEnergyAbsorb();
  } else if(hpDamage>0){ soundHpHit(); }
  if(hpDamage>0) target.hp-=hpDamage*(opts.toughnessMult ?? 1);
  target.lastHit=0;

  // Every hit restarts the normal 4s recharge delay.
  target.energyRegenDelay=4;

  // Legacy disruption timer is no longer used by the Energy Blaster.
  target.energyDisruptTimer=Math.max(0,target.energyDisruptTimer||0);

  // Zapper: 75% movement/rotation slow for 3s and +3s recharge wait.
  const slowDuration=opts.slowDuration ?? 0;
  if(slowDuration>0){
    target.slowTimer=Math.max(target.slowTimer||0,slowDuration);
    if(opts.zapRechargeExtra>0) target.zapTimer=Math.max(target.zapTimer||0,slowDuration);
  }
  const zapExtra=opts.zapRechargeExtra ?? 0;
  if(zapExtra>0) target.zapRechargeExtra=Math.max(target.zapRechargeExtra||0,zapExtra);

  // Energy Blaster: recharge rate is only 35% of normal for 3s.
  const regenSlowDuration=opts.regenSlowDuration ?? 0;
  if(regenSlowDuration>0){
    target.regenSlowTimer=Math.max(target.regenSlowTimer||0,regenSlowDuration);
  }
}

    const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    let dx=t.clientX-cx, dy=t.clientY-cy, m=Math.hypot(dx,dy), max=44;
    if(m>max){dx*=max/m; dy*=max/m;} vec.x=dx/max; vec.y=dy/max;
    nub.style.transform=`translate(${dx}px,${dy}px)`;
  }
  el.addEventListener('pointerdown',e=>{active=true; pid=e.pointerId; el.setPointerCapture(pid); update(e);});
  el.addEventListener('pointermove',e=>{if(active&&e.pointerId===pid) update(e);});
  function end(e){ if(e.pointerId!==pid) return; active=false; vec.x=vec.y=0; nub.style.transform='translate(0,0)';}
  el.addEventListener('pointerup',end); el.addEventListener('pointercancel',end);
  return {vec,get active(){return active}};
}

function returnAllPlayersToBases(){
  // Human player: revive if necessary, then place safely inside blue base.
  if(player.deadTimer>0){
    if(player.corpse){
      const ci=corpses.indexOf(player.corpse);
      if(ci>=0) corpses.splice(ci,1);
      player.corpse=null;
    }
    applyClassStats(player,player.pendingClassId || player.classId);
    player.classId=player.pendingClassId || player.classId;
    player.deadTimer=0;
    player.hp=player.maxHp;
    player.energy=player.maxEnergy;
  }

  const pSpawn=findClearSpawn(
    330,550,player.r,
    {x1:250,x2:405,y1:495,y2:605}
  );
  player.x=pSpawn.x;
  player.y=pSpawn.y;
  player.vx=0;
  player.vy=0;
  player.sprinting=false;

  // Ensure the single test ally exists, then place it in blue base.
  if(allies.length===0) spawnTestAlly();
  allies.forEach((ally,i)=>{
    const aSpawn=findClearSpawn(
      330,510+i*55,ally.r,
      {x1:250,x2:405,y1:470,y2:630}
    );
    ally.x=aSpawn.x;
    ally.y=aSpawn.y;
    ally.vx=0;
    ally.vy=0;
    ally.hp=ally.maxHp;
    ally.energy=ally.maxEnergy;
  });

  // Ensure the red side has its normal three players, then return them home.
  while(enemies.length<3) spawnEnemy();
  enemies.forEach((e,i)=>{
    const y=500+(i%3)*50;
    const eSpawn=findClearSpawn(
      1470,y,e.r,
      {x1:1395,x2:1710,y1:470,y2:630}
    );
    e.x=eSpawn.x;
    e.y=eSpawn.y;
    e.vx=0;
    e.vy=0;
    e.hp=e.maxHp;
    e.energy=e.maxEnergy;
    e.rifleBurstLeft=0;
    e.plasmaSmgBurstLeft=0;
    e.machineCharge=0;
    e.cannonCharge=0;
  });

  // End lingering combat effects so nothing keeps moving after the return.
  bullets.length=0;
  grenades.length=0;
  healJobs.length=0;
  heals.length=0;
  repulsorPulses.length=0;
  radarPulses.length=0;
  radarRevealTimer=0;

  cam.x=clamp(player.x-W/2,0,Math.max(0,world.w-W));
  cam.y=clamp(player.y-H/2,0,Math.max(0,world.h-H));

  matchFrozen=true;
  postVictoryTimer=0;
}

function update(dt){
  if(!netJoined)return;

  // Smooth remote players and gently reconcile our predicted player to server truth.
  const remoteFollow=Math.min(1,dt*13);
  for(const ent of [...allies,...enemies]){
    if(ent._tx!==undefined){
      ent.x+=(ent._tx-ent.x)*remoteFollow;
      ent.y+=(ent._ty-ent.y)*remoteFollow;
      ent.angle=approachAngle(ent.angle,ent._ta??ent.angle,9*dt);
    }
  }

  if(player._tx!==undefined){
    const errX=player._tx-player.x,errY=player._ty-player.y;
    const err=Math.hypot(errX,errY);
    if(err>90){
      player.x=player._tx;player.y=player._ty;
      player.vx=player.vy=0;
    }else{
      // Low-strength correction preserves responsiveness while preventing drift.
      const correction=Math.min(1,dt*3.2);
      player.x+=errX*correction;
      player.y+=errY*correction;
    }
  }

  // Advance authoritative projectiles visually between 30 Hz snapshots.
  for(const b of bullets){
    b.x+=b.vx*dt;
    b.y+=b.vy*dt;
    b.life=Math.max(0,(b.life||0)-dt);
  }
  for(const g of grenades){
    if(!g.embeddedGeneratorId){
      g.x+=g.vx*dt;
      g.y+=g.vy*dt;
    }
    g.fuse=Math.max(0,(g.fuse||0)-dt);
  }
  for(const fx of blasts) fx.life=Math.max(0,(fx.life||0)-dt);
  for(const fx of heals) fx.life=Math.max(0,(fx.life||0)-dt);
  for(const fx of repulsorPulses) fx.life=Math.max(0,(fx.life||0)-dt);
  for(const fx of radarPulses) fx.life=Math.max(0,(fx.life||0)-dt);

  const playerAlive=player.deadTimer<=0&&player.alive!==false;

  if(roundStarted&&playerAlive&&!matchFrozen){
    let strafe=(keys['d']?1:0)-(keys['a']?1:0);
    let forward=(keys['w']?1:0)-(keys['s']?1:0);

    if(moveStick.active){
      strafe=moveStick.vec.x;
      forward=-moveStick.vec.y;
    }

    const aimMag=Math.hypot(aimStick.vec.x,aimStick.vec.y);
    const targetAngle=(aimStick.active&&aimMag>.25)
      ? Math.atan2(aimStick.vec.y,aimStick.vec.x)
      : Math.atan2(mouse.y-(player.y-cam.y),mouse.x-(player.x-cam.x));

    const statusMult=player.slowTimer>0?.25:1;
    const localLmb=!!(mouse.left||(aimStick.active&&aimMag>.45));
    const flameActive=player.classId==='heavy'&&player.heavyPrimary==='flamethrower'&&localLmb&&(player.flameCharge||0)>=weaponStats.flamethrower.chargeTime&&player.energy>=weaponStats.flamethrower.energyCost;
    const baseTurn=player.classId==='heavy'?1.225:1.47;
    player.angle=approachAngle(player.angle,targetAngle,baseTurn*(player.zapTimer>0?.10:1)*(flameActive?.50:1)*dt);

    if(player.classChangeTarget){strafe=0;forward=0;}
    const inputMag=Math.hypot(strafe,forward);
    const sprintRequested=(keys['shift']||keys['shiftleft']||keys['shiftright'])
      && inputMag>.05 && player.energy>0 && !player.classChangeTarget;
    player.sprinting=!!sprintRequested;

    if(inputMag>.05){
      strafe/=inputMag;
      forward/=inputMag;

      const fx=Math.cos(player.angle),fy=Math.sin(player.angle),rx=-fy,ry=fx;
      const ax=fx*forward+rx*strafe,ay=fy*forward+ry*strafe;
      const fortMove=(player.fortifyTimer||0)>0?.20:1;
      player.vx+=ax*player.accel*(player.sprinting?1.35:1)*statusMult*fortMove*dt;
      player.vy+=ay*player.accel*(player.sprinting?1.35:1)*statusMult*fortMove*dt;
    }else{
      const decay=Math.max(0,1-player.drag*dt);
      player.vx*=decay;player.vy*=decay;
    }

    if(player.sprinting){
      const flagSprintMult=player.carryingFlagTeam?1.35:1;
      player.energy=Math.max(0,player.energy-player.maxEnergy*.08*flagSprintMult*dt);
      if(player.energy<=0)player.sprinting=false;
    }

    const backwardMoveMult=forward<-.05?.80:1;
    const fortMove=(player.fortifyTimer||0)>0?.20:1;
    const flameMove=flameActive?.50:1;
    const maxSpeed=player.maxSpeed*(player.sprinting?1.6:1)*statusMult*fortMove*flameMove*backwardMoveMult;
    const sp=Math.hypot(player.vx,player.vy);
    if(sp>maxSpeed){
      player.vx=player.vx/sp*maxSpeed;
      player.vy=player.vy/sp*maxSpeed;
    }

    moveWithWalls(player,player.vx*dt,player.vy*dt);
    player.x=clamp(player.x,28,world.w-28);
    player.y=clamp(player.y,28,world.h-28);

    // Server owns firing/cooldowns. Local client only predicts movement; weapon sounds and projectiles arrive as 30 Hz server events/snapshots.
    player.knifeAnim=Math.max(0,(player.knifeAnim||0)-dt);
    player.energyPulse=Math.max(0,(player.energyPulse||0)-dt*3.2);

    // Send current input to the authoritative server at 30 Hz.
    netSendTimer-=dt;
    if(netSendTimer<=0){
      netSendTimer=1/30;
      mpSend({
        type:'input',
        strafe,forward,aim:targetAngle,
        lmb:localLmb,
        rmb:!!mouse.right,
        mmb:!!mouse.middle,
        sprint:!!player.sprinting
      });
    }
  }else{
    player.sprinting=false;
    player.vx*=Math.max(0,1-5*dt);
    player.vy*=Math.max(0,1-5*dt);
  }

  radarRevealTimer=Math.max(0,(radarRevealTimer||0)-dt);

  cam.x=clamp(player.x-W/2,0,Math.max(0,world.w-W));
  cam.y=clamp(player.y-H/2,0,Math.max(0,world.h-H));

  updateLoadoutCooldownVisuals();
}

  else{

    b.innerHTML=cd>0?`REPULSOR ${charges}/2<br>${cd.toFixed(1)}s`:`REPULSOR ${charges}/2<br>R`;

}

function drawKnifeSlash(ent){
  const remaining=ent.knifeAnim||0;
  if(remaining<=0) return;

  const duration=.24;
  const p=1-clamp(remaining/duration,0,1);

  // Stab motion: extend straight outward, then retract.
  const thrust=Math.sin(Math.PI*p);
  const base=ent.r*.55;
  const reach=ent.r+13; // visually matches the reduced melee range
  const tip=base+(reach-base)*thrust;
  const fade=1-Math.max(0,(p-.84)/.16);

  ctx.save();
  ctx.translate(ent.x,ent.y);
  ctx.rotate(ent.angle);
  ctx.lineCap='round';

  // Arm/forearm points directly forward.
  ctx.strokeStyle=`rgba(220,228,238,${0.75*fade})`;
  ctx.lineWidth=2.4;
  ctx.beginPath();
  ctx.moveTo(ent.r*.25,0);
  ctx.lineTo(Math.max(ent.r*.65,tip-7),0);
  ctx.stroke();

  // Knife blade points outward from the character.
  ctx.strokeStyle=`rgba(255,255,255,${fade})`;
  ctx.lineWidth=3.2;
  ctx.beginPath();
  ctx.moveTo(Math.max(ent.r*.65,tip-7),0);
  ctx.lineTo(tip+5,0);
  ctx.stroke();

  // Bright pointed tip.
  ctx.fillStyle=`rgba(245,250,255,${fade})`;
  ctx.beginPath();
  ctx.moveTo(tip+8,0);
  ctx.lineTo(tip+2,-2.5);
  ctx.lineTo(tip+2,2.5);
  ctx.closePath();
  ctx.fill();

  // Short motion streak directly behind the stab.
  ctx.strokeStyle=`rgba(190,220,255,${0.28*fade*thrust})`;
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(ent.r,0);
  ctx.lineTo(tip-5,0);
  ctx.stroke();

  ctx.restore();
}

function drawDisruptionZaps(ent){
  if(!ent || ent.alive===false || ent.hp<=0) return;
  const visualRemaining=ent.zapVisualTimer||0;
  if(visualRemaining<=0) return;

  // Gameplay disruption lasts 2.5s. The red indicator then fades for 2s.
  const fade=(ent.zapTimer||0)>0 ? 1 : clamp(visualRemaining/2.0,0,1);
  const intensity=(ent.zapTimer||0)>0
    ? clamp((ent.zapTimer||0)/2.5,0.25,1)
    : fade;
  const pulse=.5+.5*Math.sin(performance.now()*.028);

  ctx.save();
  ctx.globalAlpha=fade;
  ctx.translate(ent.x,ent.y);

  // Red electrical halo remains visible, then fades after disruption ends.
  ctx.strokeStyle=`rgba(255,70,85,${0.24+0.22*pulse})`;
  ctx.lineWidth=1.4;
  ctx.beginPath();
  ctx.arc(0,0,ent.r+8+2*pulse,0,Math.PI*2);
  ctx.stroke();

  ctx.strokeStyle=`rgba(255,85,95,${0.48+0.42*intensity})`;
  ctx.lineWidth=1.55;
  ctx.lineCap='round';

  const t=performance.now()*0.020;
  for(let i=0;i<4;i++){
    const a=t+i*1.57;
    const r1=ent.r+4+((i*3)%5);
    const r2=r1+7;
    const x1=Math.cos(a)*r1, y1=Math.sin(a)*r1;
    const x2=Math.cos(a+.24)*r2, y2=Math.sin(a+.24)*r2;
    const xm=(x1+x2)/2 + Math.cos(a*2.7+i)*4;
    const ym=(y1+y2)/2 + Math.sin(a*2.4+i)*4;
    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.lineTo(xm,ym);
    ctx.lineTo(x2,y2);
    ctx.stroke();
  }
  ctx.restore();
}

        ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(ang); ctx.lineCap='round';
        ctx.strokeStyle='rgba(116,216,255,.30)'; ctx.lineWidth=10; ctx.beginPath(); ctx.moveTo(-18,0); ctx.lineTo(18,0); ctx.stroke();
        ctx.strokeStyle='rgba(215,248,255,.95)'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(-16,0); ctx.lineTo(16,0); ctx.stroke();
        ctx.restore();
      }else if(b.plasmaSMG){
        // Plasma SMG: extremely small, bright green energy pellet.
        ctx.save();
        ctx.translate(b.x,b.y);
        ctx.fillStyle='rgba(65,255,105,.14)';
        ctx.beginPath(); ctx.arc(0,0,b.r+1.6,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='rgba(120,255,145,.48)';
        ctx.beginPath(); ctx.arc(0,0,b.r+.55,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='rgba(225,255,230,1)';
        ctx.beginPath(); ctx.arc(0,0,b.r,0,Math.PI*2); ctx.fill();
        ctx.restore();
      }else if(b.plasma){
        // Green plasma pistol orb with a restrained glow.
        ctx.save();
        ctx.translate(b.x,b.y);
        ctx.fillStyle='rgba(65,255,105,.16)';
        ctx.beginPath(); ctx.arc(0,0,b.r+1.0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='rgba(105,255,130,.36)';
        ctx.beginPath(); ctx.arc(0,0,b.r+.35,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='rgba(205,255,210,.98)';
        ctx.beginPath(); ctx.arc(0,0,b.r,0,Math.PI*2); ctx.fill();
        ctx.restore();
      }else if(b.zapper){
        ctx.save();
        ctx.translate(b.x,b.y);
        ctx.strokeStyle='rgba(255,95,105,.92)';
        ctx.lineWidth=2;
        ctx.beginPath();
        ctx.moveTo(-5,-2); ctx.lineTo(-1,2); ctx.lineTo(2,-2); ctx.lineTo(6,1);
        ctx.stroke();
        ctx.fillStyle='rgba(255,60,75,.28)';
        ctx.beginPath(); ctx.arc(0,0,b.r+3,0,Math.PI*2); ctx.fill();
        ctx.restore();
      }else{
        ctx.save();
        ctx.translate(b.x,b.y);
        ctx.fillStyle='rgba(115,220,255,.25)';
        ctx.beginPath(); ctx.arc(0,0,b.r+3,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='rgba(220,250,255,.95)';
        ctx.beginPath(); ctx.arc(0,0,b.r,0,Math.PI*2); ctx.fill();
        ctx.restore();
      }
    } else {
      const alpha=b.fade ? Math.max(.10,bulletDamageScale(b)) : 1;
      ctx.fillStyle=b.owner==='e'?`rgba(255,139,139,${alpha})`:`rgba(255,227,123,${alpha})`;
      if(b.weaponKind==='medicGun'){
        // Carbine: compact bullet-shaped slug, larger than SMG/pistol shots but
        // smaller than the Rifle tracer.
        const a=Math.atan2(b.vy,b.vx);ctx.save();ctx.translate(b.x,b.y);ctx.rotate(a);
        ctx.beginPath();ctx.roundRect(-5.2,-1.8,10.4,3.6,1.5);ctx.fill();
        ctx.fillStyle='rgba(255,250,215,.92)';ctx.fillRect(1.5,-.60,3.0,1.2);ctx.restore();
      }else if(b.rifleBullet||b.weaponKind==='rifle'){
        const a=Math.atan2(b.vy,b.vx);ctx.save();ctx.translate(b.x,b.y);ctx.rotate(a);
        ctx.globalAlpha=alpha*.26;ctx.fillRect(-11,-2.7,22,5.4);ctx.globalAlpha=alpha;
        ctx.beginPath();ctx.roundRect(-7.5,-2.1,15,4.2,2.1);ctx.fill();ctx.restore();
      }else{
        // Physical pistol remains the smallest physical projectile.
        ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
      }
    }
  }

  drawAllCorpses();

  if(player.classChangeTarget&&player.deadTimer<=0){ctx.save();ctx.textAlign='center';ctx.font='900 11px system-ui';ctx.fillStyle='rgba(220,245,255,.96)';ctx.fillText(`CLASS CHANGE ${(player.classChangeTimer||0).toFixed(1)}s`,player.x,player.y-82);ctx.restore();}

  if(player.deadTimer<=0){
    if(player.energy>0){
      const ep=clamp(player.energy/player.maxEnergy,0,1);
      const baseAlpha=0.18*ep, pulseAlpha=0.28*player.energyPulse*ep;
      ctx.save(); ctx.translate(player.x,player.y);
      ctx.fillStyle=`rgba(104,184,255,${baseAlpha+pulseAlpha})`; ctx.beginPath(); ctx.arc(0,0,player.r+9+player.energyPulse*4,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle=`rgba(170,225,255,${0.55*ep+0.28*player.energyPulse*ep})`; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,0,player.r+6+player.energyPulse*2,0,Math.PI*2); ctx.stroke();
      ctx.restore();
    }
    drawSensorField(player); drawJammerField(player); drawFortifyShield(player); drawDisruptionZaps(player);
    if(player.classId==='assassin'&&(player.cloakTimer||0)>0){ctx.save();ctx.globalAlpha=.48;drawSoldier(player.x,player.y,player.angle,teamBodyColor(player.team),teamDetailColor(player.team),player.r,player.classId);ctx.restore();}else drawSoldier(player.x,player.y,player.angle,teamBodyColor(player.team),teamDetailColor(player.team),player.r,player.classId);
    drawKnifeSlash(player); drawCarriedFlag(player);
    ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(player.x-25,player.y-36,50,6); ctx.fillStyle='#72e27e'; ctx.fillRect(player.x-25,player.y-36,50*clamp(player.hp/player.maxHp,0,1),6);
    ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(player.x-25,player.y-28,50,5); ctx.fillStyle='#68b8ff'; ctx.fillRect(player.x-25,player.y-28,50*clamp(player.energy/player.maxEnergy,0,1),5);
    ctx.font='bold 11px system-ui'; ctx.fillStyle='#8fd0ff'; ctx.fillText(`E ${Math.ceil(player.energy)}/${player.maxEnergy} • ${Math.round(100*player.energy/player.maxEnergy)}% DR`,player.x-38,player.y-43);
    ctx.fillStyle='#9bf0a2'; ctx.fillText(`H ${Math.ceil(player.hp)}/${player.maxHp}`,player.x-28,player.y-55);
  } else {
    ctx.textAlign='center';
    ctx.font='bold 25px system-ui';
    ctx.fillStyle='white';
    ctx.fillText(`RESPAWNING ${Math.max(0,player.deadTimer).toFixed(1)}s`,player.x,player.y-12);
    ctx.font='12px system-ui';
    ctx.fillStyle='rgba(255,255,255,.78)';
    ctx.fillText(`Next class: ${classes[player.pendingClassId].name}`,player.x,player.y+12);
    ctx.textAlign='left';
  }

  ctx.restore();

  if(!roundStarted){
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,.48)';
    ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.fillStyle='white';
    ctx.font='bold 28px system-ui';
    ctx.fillText('CHOOSE YOUR CLASS',W/2,H*.36);
    ctx.restore();
  }

  const ownFlag=flags.find(f=>f.team===player.team);
  if(ownFlag&&(ownFlag.carrierId||ownFlag.dropped)){ctx.save();ctx.textAlign='center';ctx.font='900 18px system-ui';ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.86)';ctx.fillStyle='rgba(255,95,95,.94)';const txt=`${player.team.toUpperCase()} FLAG TAKEN!`;ctx.strokeText(txt,W/2,H*.22);ctx.fillText(txt,W/2,H*.22);ctx.font='800 11px system-ui';ctx.fillStyle='rgba(255,220,220,.94)';ctx.fillText('RETURN YOUR FLAG',W/2,H*.22+19);ctx.restore();}

  if(gameOver){
    const playerWon=winningTeam===player.team;
    ctx.save();
    ctx.textAlign='center';

    const bannerW=Math.min(420,W-24);
    const bannerH=matchFrozen?58:72;
    const bx=(W-bannerW)/2;
    const by=18;

    ctx.fillStyle='rgba(6,10,16,.80)';
    ctx.fillRect(bx,by,bannerW,bannerH);
    ctx.strokeStyle=playerWon?'rgba(145,210,255,.72)':'rgba(255,145,145,.72)';
    ctx.lineWidth=2;
    ctx.strokeRect(bx+.5,by+.5,bannerW-1,bannerH-1);

    ctx.fillStyle=playerWon?'#9fd4ff':'#ffaaaa';
    ctx.font='bold 22px system-ui';
    ctx.fillText(playerWon?'VICTORY':'DEFEAT',W/2,by+28);

    ctx.fillStyle='rgba(255,255,255,.90)';
    ctx.font='bold 13px system-ui';
    if(matchFrozen){
      ctx.fillText('MATCH COMPLETE • ALL PLAYERS RETURNED TO BASE',W/2,by+49);
    }else{
      ctx.fillText(
        `${winningTeam.toUpperCase()} TEAM WINS • RETURN TO BASE IN ${postVictoryTimer.toFixed(1)}s`,
        W/2,
        by+51
      );
      ctx.font='11px system-ui';
      ctx.fillStyle='rgba(255,255,255,.68)';
      ctx.fillText('Post-game combat remains active',W/2,by+66);
    }
    ctx.restore();
  }

  if(paused && singlePlayer){
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,.48)';
    ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.fillStyle='white';
    ctx.font='bold 34px system-ui';
    ctx.fillText('PAUSED',W/2,H/2-10);
    ctx.font='14px system-ui';
    ctx.fillStyle='rgba(255,255,255,.82)';
    ctx.fillText('Pause disabled in team-switch debug mode',W/2,H/2+20);
    ctx.restore();
  }

  updateLoadoutCooldownVisuals();
  cash=player.cash||0;kills=player.kills||0;deaths=player.deaths||0;
  document.getElementById('cash').textContent=`Cash: $${cash}`;
  const fg=generators.find(g=>g.team===player.team);
  const fgh=document.getElementById('friendlyGenerator');
  if(fgh&&fg)fgh.textContent=`${player.team.toUpperCase()} GENERATOR: ${Math.ceil(fg.hp)}/${fg.maxHp}`;
  const flagLine=`Flags ${netFlagScore.blue||0}-${netFlagScore.red||0} (first to ${netFlagWinScore})`;
  document.getElementById('score').textContent=!roundStarted
    ? `Choose a class to start | ${flagLine}`
    : gameOver
      ? (matchFrozen?`${winningTeam?.toUpperCase()} TEAM WINS • ${flagLine} • New match incoming`:`${winningTeam?.toUpperCase()} TEAM WINS • ${flagLine} • Return to base in ${postVictoryTimer.toFixed(1)}s`)
      : player.deadTimer>0
        ? `${flagLine} | Respawning: ${player.deadTimer.toFixed(1)}s | Kills: ${kills} | Deaths: ${deaths}`
        : `${flagLine} | ${player.regenSlowTimer>0?'REGEN 35% | ':''}${player.sprinting?'SPRINT | ':''}${player.zapTimer>0?'ZAPPED | ':''}Kills: ${kills} | Deaths: ${deaths} | Regen wait: ${Math.max(0,(4+(player.zapRechargeExtra||0))-(player.lastHit||0)).toFixed(1)}s`;
  updateAbilityButton();
}

renderLoadout();
renderRespawnClassPicker();
let last=performance.now();
function loop(t){ const dt=Math.min(.033,(t-last)/1000); last=t; update(dt); draw(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
</body>
</html>
