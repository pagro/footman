<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Infantry Multiplayer Authoritative v2</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b1118;font-family:system-ui,sans-serif;color:#fff}
#wrap{position:relative;width:100%;height:100%}
canvas{display:block;width:100%;height:100%;background:#17212b}
#hud{position:absolute;left:12px;top:10px;z-index:5;background:rgba(5,10,15,.7);padding:8px 10px;border-radius:8px;font-size:12px;line-height:1.4}
#classbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:6;display:flex;gap:6px}
#classbar button,#lobby button{background:#244661;color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:8px 10px;font-weight:700;cursor:pointer}
#lobby{position:absolute;inset:0;z-index:20;background:rgba(2,5,9,.9);display:flex;align-items:center;justify-content:center}
#lobby.hidden{display:none}
#panel{width:min(420px,calc(100vw - 30px));background:#111923;border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:18px;box-sizing:border-box}
#panel h2{margin:0 0 8px}
#panel p{color:#b8c3cf;font-size:13px}
#panel input{width:100%;box-sizing:border-box;background:#091019;color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:10px;margin:8px 0;text-transform:uppercase}
.row{display:flex;gap:8px}.row button{flex:1}
#status{margin-top:10px;font-size:12px;color:#9fd4ff;min-height:16px}
#help{position:absolute;right:12px;top:10px;z-index:5;background:rgba(5,10,15,.68);padding:8px 10px;border-radius:8px;font-size:11px;color:#d6e0ea}
</style>
</head>
<body>
<div id="wrap">
<canvas id="game"></canvas>
<div id="hud">OFFLINE</div>
<div id="help">WASD move · Mouse aim · LMB primary · RMB secondary · MMB utility · Shift sprint</div>
<div id="classbar">
  <button data-class="footman">Footman</button>
  <button data-class="heavy">Heavy</button>
  <button data-class="assassin">Assassin</button>
  <button data-class="medic">Medic</button>
</div>
<div id="lobby">
  <div id="panel">
    <h2>Authoritative Multiplayer</h2>
    <p>The server owns movement, combat, HP/Energy, projectiles, deaths, generators, victory, and bots.</p>
    <input id="room" maxlength="4" placeholder="ROOM CODE">
    <div class="row">
      <button id="create">Create Room</button>
      <button id="join">Join Room</button>
    </div>
    <div id="status">Connecting…</div>
  </div>
</div>
</div>
<script>
const WORLD={w:1800,h:1100};
const CLASSES={
 footman:{name:'Footman',r:12},heavy:{name:'Heavy',r:12},
 assassin:{name:'Assassin',r:9.6},medic:{name:'Medic',r:12}
};
const WALLS=[
  {x:40,y:330,w:400,h:20},{x:40,y:750,w:400,h:20},{x:40,y:350,w:20,h:400},
  {x:420,y:350,w:20,h:145},{x:420,y:605,w:20,h:145},
  {x:120,y:455,w:116,h:20},{x:120,y:625,w:116,h:20},{x:236,y:455,w:20,h:190},
  {x:1360,y:330,w:400,h:20},{x:1360,y:750,w:400,h:20},{x:1740,y:350,w:20,h:400},
  {x:1360,y:350,w:20,h:145},{x:1360,y:605,w:20,h:145},
  {x:1564,y:455,w:116,h:20},{x:1564,y:625,w:116,h:20},{x:1544,y:455,w:20,h:190},
  {x:548,y:524,w:50,h:50},{x:662,y:532,w:60,h:38},{x:1078,y:532,w:60,h:38},{x:1202,y:524,w:50,h:50},
  {x:720,y:166,w:74,h:24},{x:1006,y:166,w:74,h:24},{x:720,y:910,w:74,h:24},{x:1006,y:910,w:74,h:24},
  {x:584,y:608,w:42,h:42},{x:1174,y:450,w:42,h:42}
];

const c=document.getElementById('game'),ctx=c.getContext('2d');
let W=innerWidth,H=innerHeight,DPR=1;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*DPR;c.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();

let ws=null,connected=false,roomCode='',myId='',team='';
let snapshot={players:[],projectiles:[],grenades:[],generators:[],winningTeam:null,postVictoryTimer:0,frozen:false};
let keys={},mouse={x:W/2,y:H/2,left:false,right:false,middle:false};
let cam={x:0,y:0},sendTimer=0;

function wsUrl(){return `${location.protocol==='https:'?'wss':'ws'}://${location.host}`}
function setStatus(t,bad=false){const s=document.getElementById('status');s.textContent=t;s.style.color=bad?'#ffaaaa':'#9fd4ff'}
function send(o){if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify(o))}
function connect(){
 ws=new WebSocket(wsUrl());
 ws.onopen=()=>{connected=true;setStatus('Connected. Create or join a room.')};
 ws.onclose=()=>{connected=false;setStatus('Disconnected.',true)};
 ws.onerror=()=>setStatus('Connection error.',true);
 ws.onmessage=e=>{
   let m;try{m=JSON.parse(e.data)}catch{return}
   if(m.type==='room_created'||m.type==='room_joined'){
     roomCode=m.roomCode;myId=m.playerId;team=m.team;
     document.getElementById('room').value=roomCode;
     document.getElementById('lobby').classList.add('hidden');
     return;
   }
   if(m.type==='error'){setStatus(m.message||'Error',true);return}
   if(m.type==='snapshot') snapshot=m;
 };
}
connect();

document.getElementById('create').onclick=()=>connected?send({type:'create_room'}):setStatus('Not connected yet.',true);
document.getElementById('join').onclick=()=>{
 const code=document.getElementById('room').value.trim().toUpperCase();
 if(!code){setStatus('Enter room code.',true);return}
 send({type:'join_room',roomCode:code});
};
for(const b of document.querySelectorAll('#classbar button')){
 b.onclick=()=>send({type:'class',classId:b.dataset.class});
}

addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
c.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
c.addEventListener('mousedown',e=>{if(e.button===0)mouse.left=true;if(e.button===1)mouse.middle=true;if(e.button===2)mouse.right=true});
addEventListener('mouseup',e=>{if(e.button===0)mouse.left=false;if(e.button===1)mouse.middle=false;if(e.button===2)mouse.right=false});
c.addEventListener('contextmenu',e=>e.preventDefault());

function me(){return snapshot.players.find(p=>p.id===myId)}
function update(dt){
 const p=me();if(!p)return;
 cam.x=Math.max(0,Math.min(WORLD.w-W,p.x-W/2));cam.y=Math.max(0,Math.min(WORLD.h-H,p.y-H/2));
 const aim=Math.atan2(mouse.y-(p.y-cam.y),mouse.x-(p.x-cam.x));
 let mx=(keys['d']?1:0)-(keys['a']?1:0),my=(keys['s']?1:0)-(keys['w']?1:0);
 const mag=Math.hypot(mx,my);if(mag>1){mx/=mag;my/=mag}
 sendTimer-=dt;
 if(sendTimer<=0){
   sendTimer=1/30;
   send({type:'input',mx,my,aim,primary:mouse.left,secondary:mouse.right,utility:mouse.middle,sprint:!!keys['shift']});
 }
}

function soldier(p){
 ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle);
 const body=p.team==='blue'?'#4d94d8':'#df5757';
 const detail=p.isBot?'#d7d7d7':'#fff';
 ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(-p.r*.55,0,p.r*.7,p.r*.45,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle=body;ctx.beginPath();ctx.ellipse(0,0,p.r*.85,p.r*.65,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle=detail;ctx.beginPath();ctx.arc(p.r*.55,0,p.r*.28,0,Math.PI*2);ctx.fill();
 ctx.fillRect(p.r*.45,-2,p.r*.9,4);
 ctx.restore();

 ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(p.x-18,p.y-31,36,4);
 ctx.fillStyle='#68b8ff';ctx.fillRect(p.x-18,p.y-31,36*Math.max(0,p.energy/p.maxEnergy),4);
 ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(p.x-18,p.y-25,36,5);
 ctx.fillStyle='#72e27e';ctx.fillRect(p.x-18,p.y-25,36*Math.max(0,p.hp/p.maxHp),5);
 ctx.fillStyle=p.team==='blue'?'#bfe2ff':'#ffc4c4';ctx.font='10px system-ui';
 ctx.fillText(`${p.isBot?'BOT':'PLAYER'} ${CLASSES[p.classId]?.name||''}`,p.x-26,p.y-38);
}

function draw(){
 ctx.clearRect(0,0,W,H);
 ctx.save();ctx.translate(-cam.x,-cam.y);
 ctx.fillStyle='#1c2631';ctx.fillRect(0,0,WORLD.w,WORLD.h);
 ctx.strokeStyle='rgba(255,255,255,.05)';ctx.lineWidth=1;
 for(let x=0;x<WORLD.w;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,WORLD.h);ctx.stroke()}
 for(let y=0;y<WORLD.h;y+=80){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(WORLD.w,y);ctx.stroke()}

 for(const w of WALLS){ctx.fillStyle='#3d4a56';ctx.fillRect(w.x,w.y,w.w,w.h)}
 for(const g of snapshot.generators){
   ctx.fillStyle=g.team==='blue'?'#2e6fab':'#a84343';ctx.fillRect(g.x,g.y,g.w,g.h);
   ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(g.x,g.y-10,g.w,6);
   ctx.fillStyle='#78e27d';ctx.fillRect(g.x,g.y-10,g.w*Math.max(0,g.hp/g.maxHp),6);
   ctx.fillStyle='#fff';ctx.font='10px system-ui';ctx.fillText(`${Math.ceil(g.hp)}/${g.maxHp}`,g.x,g.y-14);
   ctx.fillStyle='#f7d36d';ctx.fillRect(g.backDoor.x,g.backDoor.y,g.backDoor.w,g.backDoor.h);
 }

 for(const gr of snapshot.grenades){ctx.fillStyle='#f1f1f1';ctx.beginPath();ctx.arc(gr.x,gr.y,5,0,Math.PI*2);ctx.fill()}
 for(const b of snapshot.projectiles){
   ctx.fillStyle=b.team==='blue'?'#9fd4ff':'#ff9d9d';
   if(b.kind==='plasmaSMG'||b.kind==='plasmaPistol')ctx.fillStyle='#66ff80';
   if(b.kind==='zapper')ctx.fillStyle='#b7f5ff';
   ctx.beginPath();ctx.arc(b.x,b.y,Math.max(2,b.r),0,Math.PI*2);ctx.fill();
 }

 for(const p of snapshot.players){
   if(p.alive) soldier(p);
   else{
     ctx.save();ctx.globalAlpha=.35;ctx.fillStyle='#6c737a';ctx.beginPath();ctx.ellipse(p.x,p.y,p.r*1.2,p.r*.65,0,0,Math.PI*2);ctx.fill();ctx.restore();
   }
 }
 ctx.restore();

 const p=me();
 document.getElementById('hud').textContent=p
  ? `Room ${roomCode} • ${team.toUpperCase()} • ${CLASSES[p.classId]?.name||''} • HP ${Math.ceil(p.hp)}/${p.maxHp} • E ${Math.ceil(p.energy)}/${p.maxEnergy}${snapshot.winningTeam?` • ${snapshot.winningTeam.toUpperCase()} WINS • ${snapshot.postVictoryTimer.toFixed(1)}s`:''}`
  : (connected?'Connected':'Offline');
}

let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body>
</html>
